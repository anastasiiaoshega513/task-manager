<div id="project-{{ project.pk }}">
  <h2>{{ project.name }}</h2>

  <button
    type="button"
    hx-post="{% url 'tasks:project-delete' project.pk %}"
    hx-target="#project-{{ project.pk }}"
    hx-swap="outerHTML"
  >
    Delete
  </button>

  <button
    type="button"
    hx-get="{% url 'tasks:project-update' project.pk %}"
    hx-target="#project-{{ project.pk }}"
    hx-swap="outerHTML"
  >
    Edit
  </button>

  <form
    hx-post="{% url 'tasks:task-create' project.pk %}"
    hx-target="#project-{{ project.pk }}"
    hx-swap="outerHTML"
  >
    {% csrf_token %}
    {{ task_create_form.as_p }}
    <button type="submit">Add Task</button>
  </form>

  <div>
    {% for task in project.tasks.all %}
      {% include "tasks/partials/task.html" %}
    {% empty %}
      <p>No tasks yet.</p>
    {% endfor %}
  </div>
</div>
