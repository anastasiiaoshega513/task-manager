<div
  id="project-{{ project.pk }}"
  class="project-card mb-4"
>
  <div class="project-header d-flex justify-content-between align-items-center">
    <h2 class="project-title mb-0">
      <i class="bi bi-calendar2-week" style="color: #303030;"></i> {{ project.name }}
    </h2>

    <div>
      <button
        type="button"
        class="btn text-white"
        hx-get="{% url 'tasks:project-update' project.pk %}"
        hx-target="#project-{{ project.pk }}"
        hx-swap="outerHTML"
      >
        <i class="bi bi-pen"></i>
      </button>

      <button
        type="button"
        class="btn text-white"
        hx-post="{% url 'tasks:project-delete' project.pk %}"
        hx-target="#project-{{ project.pk }}"
        hx-swap="outerHTML"
      >
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>

  <form
    hx-post="{% url 'tasks:task-create' project.pk %}"
    hx-target="#project-{{ project.pk }}"
    hx-swap="outerHTML"
  >
    {% csrf_token %}
    {{ task_create_form.as_p }}
    <button type="submit">Add Task</button>
  </form>

  <div>
    {% for task in project.tasks.all %}
      {% include "tasks/partials/task.html" %}
    {% empty %}
      <p>No tasks yet.</p>
    {% endfor %}
  </div>
</div>
