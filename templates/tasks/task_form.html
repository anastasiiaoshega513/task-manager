{% extends "base.html" %}

{% block title %}
  {% if object %}Update Task{% else %}Create Task{% endif %}
{% endblock %}

{% block content %}
  <h1>
    {% if object %}Update Task{% else %}Create Task{% endif %}
  </h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
      {% if object %}Update{% else %}Create{% endif %}
    </button>
  </form>

  <a href="{% url 'tasks:project-list' %}">Back</a>
{% endblock %}
