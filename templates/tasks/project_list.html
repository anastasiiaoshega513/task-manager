{% extends "base.html" %}

{% block title %}Projects{% endblock %}
{% block content %}
  <h1>Projects</h1>

  <button
    type="button"
    hx-get="{% url 'tasks:project-create' %}"
    hx-target="#projects"
    hx-swap="beforeend"
  >
    Add Project
  </button>

  <div id="projects">
    {% for project in projects %}
      {% include "tasks/partials/project.html" %}
    {% endfor %}
  </div>
{% endblock %}
