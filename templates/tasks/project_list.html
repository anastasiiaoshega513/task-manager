{% extends "base.html" %}

{% block title %}Projects{% endblock %}
{% block content %}
  <div class="container py-5">
    <div id="projects">
      {% for project in projects %}
        {% include "tasks/partials/project.html" %}
      {% endfor %}
    </div>

    <button
      type="button"
      class="btn btn-primary mt-4"
      hx-get="{% url 'tasks:project-create' %}"
      hx-target="#projects"
      hx-swap="beforeend"
    >
      ➕ Add TODO List
    </button>
  </div>
{% endblock %}
