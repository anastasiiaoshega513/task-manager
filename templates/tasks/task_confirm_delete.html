{% extends "base.html" %}
{% block title %}Delete Task{% endblock %}
{% block content %}
  <h1>Delete Task</h1>
  <p>Are you sure you want to delete "{{ object.name }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
  </form>

  <a href="{% url 'tasks:project-list' %}">Cancel</a>
{% endblock %}
