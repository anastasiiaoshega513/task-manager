{% extends "account/base_card.html" %}

{% block title %}Sign Up{% endblock %}
{% block card_title %}Sign Up{% endblock %}

{% block card_body %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {{ redirect_field }}
    <button type="submit" class="btn btn-outline-primary w-100">Sign Up</button>
  </form>

  <p class="mt-3 mb-0">
    Already have an account? <a href="{% url 'account_login' %}">Sign in</a>
  </p>
{% endblock %}
