<!DOCTYPE html>
<html lang="en">
<head>
  {% load django_htmx %}

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% htmx_script %}

  <title>{% block title %}Task Manager{% endblock %}</title>
</head>
<body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>
  {% block content %}
  {% endblock %}
</body>
</html>
